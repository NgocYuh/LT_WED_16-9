<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product & Category CRUD</title>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <style>
    :root{font-family:system-ui,sans-serif;color:#172033;background:#f5f7fb} body{margin:0}.bar{background:#16213e;color:#fff;padding:18px max(24px,calc((100vw - 1200px)/2));display:flex;justify-content:space-between;align-items:center}.bar a{color:#b8f1ff}main{max-width:1200px;margin:28px auto;padding:0 20px}.grid{display:grid;grid-template-columns:1fr 1.6fr;gap:22px}.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 3px 18px #16213e12}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}h1,h2{margin:0}h1{font-size:20px}h2{font-size:18px}button{cursor:pointer;border:0;border-radius:7px;padding:8px 12px;background:#2364d2;color:#fff;font-weight:600}button.danger{background:#c83148}button.ghost{background:#e8edf7;color:#16213e}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #e7eaf0;padding:10px;text-align:left;vertical-align:middle}th{color:#536178;white-space:nowrap}td.actions{white-space:nowrap}img.icon{width:36px;height:36px;object-fit:cover;border-radius:6px;background:#eef1f6}.empty{color:#667085;font-style:italic}dialog{border:0;border-radius:12px;padding:0;width:min(580px,calc(100vw - 36px));box-shadow:0 14px 45px #0006}dialog::backdrop{background:#17203388}.modal-head{background:#16213e;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.modal-body{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:5px;font-size:14px;font-weight:600}input,select,textarea{box-sizing:border-box;width:100%;padding:9px;border:1px solid #cbd3e1;border-radius:6px;font:inherit}textarea{min-height:76px}.wide{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{position:fixed;right:18px;bottom:18px;padding:12px 16px;border-radius:8px;color:#fff;background:#1f7a4f;display:none}.notice.error{background:#bb2939}@media(max-width:850px){.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="bar"><h1>Quản lý Product & Category bằng AJAX</h1><a href="/swagger-ui.html" target="_blank">Mở Swagger UI</a></header>
<main><div class="grid">
  <section class="card"><div class="head"><h2>Danh mục</h2><button onclick="openCategory()">+ Thêm category</button></div>
    <table><thead><tr><th>Icon</th><th>Tên</th><th>Thao tác</th></tr></thead><tbody id="categoryRows"></tbody></table></section>
  <section class="card"><div class="head"><h2>Sản phẩm</h2><button onclick="openProduct()">+ Thêm product</button></div>
    <table><thead><tr><th>Sản phẩm</th><th>Category</th><th>Giá</th><th>SL</th><th>TT</th><th>Thao tác</th></tr></thead><tbody id="productRows"></tbody></table></section>
</div></main>
<dialog id="categoryDialog"><div class="modal-head"><strong id="categoryTitle">Thêm category</strong><button class="ghost" onclick="closeDialog('categoryDialog')">×</button></div><form id="categoryForm" class="modal-body"><input type="hidden" name="id"><label>Tên category<input name="categoryName" maxlength="150" required></label><label style="margin-top:14px">Icon (không bắt buộc)<input type="file" name="icon" accept="image/*"></label><div class="form-actions"><button type="button" class="ghost" onclick="closeDialog('categoryDialog')">Hủy</button><button>Lưu</button></div></form></dialog>
<dialog id="productDialog"><div class="modal-head"><strong id="productTitle">Thêm product</strong><button class="ghost" onclick="closeDialog('productDialog')">×</button></div><form id="productForm" class="modal-body"><input type="hidden" name="id"><div class="form-grid"><label class="wide">Tên product<input name="productName" maxlength="500" required></label><label>Category<select name="categoryId" required></select></label><label>Số lượng<input type="number" name="quantity" min="0" value="0" required></label><label>Đơn giá<input type="number" name="unitPrice" min="0" step="0.01" required></label><label>Giảm giá (%)<input type="number" name="discount" min="0" max="100" step="0.01" value="0" required></label><label>Trạng thái<select name="status"><option value="1">Đang bán</option><option value="0">Ngừng bán</option></select></label><label>Ảnh (không bắt buộc)<input type="file" name="image" accept="image/*"></label><label class="wide">Mô tả<textarea name="description" maxlength="500" required></textarea></label></div><div class="form-actions"><button type="button" class="ghost" onclick="closeDialog('productDialog')">Hủy</button><button>Lưu</button></div></form></dialog>
<div id="notice" class="notice"></div>
<script>
  let categories=[], products=[];
  const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  function show(message,error=false){const n=$('#notice');n.text(message).toggleClass('error',error).stop(true,true).fadeIn(120).delay(2600).fadeOut(260)}
  function request(options){return $.ajax(options).fail(x=>show(x.responseJSON?.message||'Yêu cầu không thành công',true));}
  function icon(file){return file?`<img class="icon" src="/uploads/${encodeURIComponent(file)}" alt="">`:'—'}
  function render(){
    $('#categoryRows').html(categories.length?categories.map(c=>`<tr><td>${icon(c.icon)}</td><td>${esc(c.categoryName)}</td><td class="actions"><button onclick="openCategory(${c.categoryId})">Sửa</button> <button class="danger" onclick="removeCategory(${c.categoryId})">Xóa</button></td></tr>`).join(''):'<tr><td colspan="3" class="empty">Chưa có category.</td></tr>');
    $('#productRows').html(products.length?products.map(p=>`<tr><td>${icon(p.image)} ${esc(p.productName)}<br><small>${esc(p.description)}</small></td><td>${esc(p.categoryName)}</td><td>${Number(p.unitPrice).toLocaleString('vi-VN')} ₫<br><small>-${p.discount}%</small></td><td>${p.quantity}</td><td>${p.status?'Đang bán':'Ngừng bán'}</td><td class="actions"><button onclick="openProduct(${p.productId})">Sửa</button> <button class="danger" onclick="removeProduct(${p.productId})">Xóa</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Chưa có product.</td></tr>');
  }
  function refresh(){return $.when(request({url:'/api/categories'}),request({url:'/api/products'})).done((c,p)=>{categories=c[0].body;products=p[0].body;render();});}
  function closeDialog(id){document.getElementById(id).close();}
  function openCategory(id){const f=$('#categoryForm')[0], c=categories.find(x=>x.categoryId===id);f.reset();f.id.value=id||'';f.categoryName.value=c?.categoryName||'';$('#categoryTitle').text(c?'Cập nhật category':'Thêm category');document.getElementById('categoryDialog').showModal();}
  function openProduct(id){if(!categories.length){show('Hãy tạo category trước.',true);return;}const f=$('#productForm')[0],p=products.find(x=>x.productId===id);f.reset();$(f.categoryId).html(categories.map(c=>`<option value="${c.categoryId}">${esc(c.categoryName)}</option>`));f.id.value=id||'';if(p){f.productName.value=p.productName;f.categoryId.value=p.categoryId;f.quantity.value=p.quantity;f.unitPrice.value=p.unitPrice;f.discount.value=p.discount;f.status.value=p.status;f.description.value=p.description;}$('#productTitle').text(p?'Cập nhật product':'Thêm product');document.getElementById('productDialog').showModal();}
  function removeCategory(id){if(confirm('Xóa category này?'))request({url:'/api/categories/'+id,type:'DELETE'}).done(()=>{show('Đã xóa category');refresh();});}
  function removeProduct(id){if(confirm('Xóa product này?'))request({url:'/api/products/'+id,type:'DELETE'}).done(()=>{show('Đã xóa product');refresh();});}
  $('#categoryForm').on('submit',function(e){e.preventDefault();const id=this.id.value;request({url:id?'/api/categories/'+id:'/api/categories',type:id?'PUT':'POST',data:new FormData(this),contentType:false,processData:false}).done(()=>{closeDialog('categoryDialog');show('Đã lưu category');refresh();});});
  $('#productForm').on('submit',function(e){e.preventDefault();const id=this.id.value;request({url:id?'/api/products/'+id:'/api/products',type:id?'PUT':'POST',data:new FormData(this),contentType:false,processData:false}).done(()=>{closeDialog('productDialog');show('Đã lưu product');refresh();});});
  refresh();
</script></body></html>
